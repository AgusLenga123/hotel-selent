<!-- ============ GALERÍA ============ -->
<section class="section gallery-section" aria-labelledby="galeria-title">
  <div class="wrap">
    <div class="section-head">
      <div>
        <p class="eyebrow reveal">Galería</p>
        <h2 class="h2 reveal" id="galeria-title">Conocé el hotel</h2>
      </div>
      <p class="section-lead reveal">Recepción, living, bar y habitaciones: así te espera el Selent.</p>
    </div>
    <div class="gallery" id="gallery">
      <button class="g-item g-tall reveal" data-full="assets/img/living.webp"><img src="assets/img/living.webp" alt="Living del hotel con sillones naranjas y vigas de madera" loading="lazy"></button>
      <button class="g-item reveal" data-full="assets/img/bar.webp"><img src="assets/img/bar.webp" alt="Bar de madera con banquetas" loading="lazy"></button>
      <button class="g-item reveal" data-full="assets/img/hab-duplex-5-b.webp"><img src="assets/img/hab-duplex-5-b-sm.webp" alt="Habitación con ventanal y balcón" loading="lazy"></button>
      <button class="g-item g-wide reveal" data-full="assets/img/entrada-jardin.webp"><img src="assets/img/entrada-jardin.webp" alt="Patio de entrada con plantas y balcones" loading="lazy"></button>
      <button class="g-item reveal" data-full="assets/img/hab-habitacion-matrimonial.webp"><img src="assets/img/hab-habitacion-matrimonial-sm.webp" alt="Habitación con cama matrimonial" loading="lazy"></button>
      <button class="g-item g-tall reveal" data-full="assets/img/fachada-calle.webp"><img src="assets/img/fachada-calle.webp" alt="Fachada del Hotel Selent sobre calle Arenales" loading="lazy"></button>
      <button class="g-item reveal" data-full="assets/img/hotel-balcones.webp"><img src="assets/img/hotel-balcones.webp" alt="Balcones y jardín interno del hotel" loading="lazy"></button>
      <button class="g-item g-wide reveal" data-full="assets/img/entrada.webp"><img src="assets/img/entrada.webp" alt="Ingreso al estacionamiento propio" loading="lazy"></button>
    </div>
  </div>
</section>
