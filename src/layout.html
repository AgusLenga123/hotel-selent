<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0c3f3b">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="assets/img/{{image}}.webp">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/{{image}}.webp">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Hotel",
    "name": "Hotel Selent",
    "description": "Hotel familiar en Mar del Plata desde 1969, a 200 metros de la playa.",
    "url": "https://hotelselent.com.ar/",
    "telephone": "+54 223 494-0878",
    "email": "info@hotelselent.com.ar",
    "foundingDate": "1969",
    "starRating": { "@type": "Rating", "ratingValue": "2" },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Arenales 2347",
      "postalCode": "B7600EGE",
      "addressLocality": "Mar del Plata",
      "addressRegion": "Buenos Aires",
      "addressCountry": "AR"
    },
    "sameAs": [
      "https://www.facebook.com/HotelSelent/",
      "https://www.instagram.com/hotel.selent/",
      "https://www.tripadvisor.com.ar/Hotel_Review-g312749-d672856-Reviews-Hotel_Selent-Mar_del_Plata_Province_of_Buenos_Aires_Central_Argentina.html"
    ]
  }
  </script>
</head>
<body data-page="{{page}}">

{{> partials/sprite}}
<a class="skip" href="#contenido">Saltar al contenido</a>

{{> partials/header}}
<main id="contenido">

{{content}}
</main>

{{> partials/footer}}
<script src="assets/js/main.js" defer></script>
</body>
</html>
